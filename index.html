<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WordGarden - Ad-Free Word Puzzles</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#13242d">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { width: 100vw; height: 100vh; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(175deg, #13242d 0%, #244855 100%); color: #fff; display: flex; justify-content: center; }
    #app { width: 100%; max-width: 460px; height: 100%; display: flex; flex-direction: column; position: relative; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(15,30,42,0.5); backdrop-filter: blur(8px); z-index: 10; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .hdr-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; width: 36px; height: 36px; color: #fff; cursor: pointer; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; }
    .badge { display: inline-flex; align-items: center; gap: 5px; background: rgba(244,114,182,0.25); border: 1px solid rgba(244,114,182,0.4); padding: 4px 10px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; color: #fbcfe8; cursor: pointer; }
    .nav-tabs { display: flex; padding: 6px 12px; gap: 6px; background: rgba(10,20,30,0.3); z-index: 10; }
    .tab { flex: 1; padding: 8px 4px; background: transparent; border: none; border-radius: 8px; color: #94a3b8; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .tab.active { background: rgba(255,255,255,0.15); color: #fff; }
    #game-view { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 16px; z-index: 5; }
    #board { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px; position: relative; }
    #grid { display: grid; gap: 6px; margin: auto; }
    .cell { width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.3rem; position: relative; }
    .cell.inactive { background: transparent; }
    .cell.empty { background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35); }
    .cell.solved { background: #fff; color: #0f172a; border: 1px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.3), 0 0 12px rgba(255,255,255,0.4); animation: pop 0.3s ease; }
    @keyframes pop { 0% { transform: scale(0.7); } 100% { transform: scale(1); } }
    .bf-icon { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; animation: flutter 1.5s infinite alternate ease-in-out; pointer-events: none; }
    @keyframes flutter { 0% { transform: rotate(-8deg); } 100% { transform: rotate(8deg) translateY(-2px); } }
    .flying-bf { position: fixed; width: 32px; height: 32px; pointer-events: none; z-index: 100; transition: all 0.85s cubic-bezier(0.25,1,0.5,1); }
    #preview-wrap { height: 36px; display: flex; align-items: center; justify-content: center; }
    #preview { padding: 5px 18px; background: rgba(15,23,42,0.8); border: 1px solid rgba(56,189,248,0.4); border-radius: 20px; font-size: 1.2rem; font-weight: 800; letter-spacing: 3px; color: #38bdf8; opacity: 0; transform: translateY(4px); transition: 0.15s; }
    #preview.show { opacity: 1; transform: translateY(0); }
    #preview.shake { animation: shake 0.4s ease; border-color: #ef4444; color: #ef4444; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25%,75% { transform: translateX(-6px); } 50% { transform: translateX(6px); } }
    #wheel-wrap { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 0 12px; }
    .side-btn { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; }
    #wheel { position: relative; width: 210px; height: 210px; border-radius: 50%; background: rgba(15,30,42,0.7); border: 3px solid rgba(255,255,255,0.15); box-shadow: 0 8px 30px rgba(0,0,0,0.4); touch-action: none; }
    #svg-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
    .node { position: absolute; width: 48px; height: 48px; border-radius: 50%; background: #fff; color: #0f172a; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 800; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transform: translate(-50%,-50%); z-index: 3; pointer-events: none; }
    .node.selected { background: #38bdf8; color: #fff; transform: translate(-50%,-50%) scale(1.15); box-shadow: 0 0 15px rgba(56,189,248,0.8); }
    #toast { position: absolute; top: 65px; left: 50%; transform: translateX(-50%); background: rgba(15,23,42,0.9); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 90; border: 1px solid rgba(255,255,255,0.15); white-space: nowrap; }
    #toast.show { opacity: 1; }
    .modal { position: absolute; inset: 0; background: rgba(10,20,28,0.85); backdrop-filter: blur(8px); display: none; z-index: 100; padding: 20px; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .modal.active { display: flex; }
    .card { background: #1e3a47; border: 1px solid rgba(255,255,255,0.18); border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; }
    .btn { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff; border: none; padding: 12px 24px; border-radius: 25px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 16px; }
    #sanctuary-view { flex: 1; display: none; flex-direction: column; padding: 16px; overflow-y: auto; z-index: 5; }
    #sanctuary-view.active { display: flex; }
    .garden { height: 180px; border-radius: 14px; background: linear-gradient(180deg, #1e40af 0%, #065f46 75%, #064e3b 100%); position: relative; overflow: hidden; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.15); }
    .g-bf { position: absolute; width: 28px; height: 28px; animation: floatBf 5s infinite alternate ease-in-out; }
    @keyframes floatBf { 0% { transform: translate(0,0) rotate(5deg); } 50% { transform: translate(30px,-35px) rotate(-10deg); } 100% { transform: translate(-20px,-20px) rotate(10deg); } }
    .species-list { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
    .sp-card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 10px; display: flex; align-items: center; gap: 8px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 12px 0; }
    .cal-day { aspect-ratio: 1; background: rgba(255,255,255,0.08); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; cursor: pointer; position: relative; }
    .cal-day.done { background: rgba(16,185,129,0.3); border: 1px solid #10b981; color: #6ee7b7; }
    .cal-day.today { border: 1px solid #38bdf8; box-shadow: 0 0 8px rgba(56,189,248,0.5); }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="hdr-btn" id="btn-sound">🔊</button>
      <div class="badge" id="btn-sanctuary"><span>🦋</span><span id="bf-count">0</span></div>
    </div>
    <div style="text-align:center;">
      <div id="hdr-title" style="font-weight:700; font-size:1.05rem;">Level 1</div>
      <div id="hdr-sub" style="font-size:0.75rem; color:#94a3b8; text-transform:uppercase;">Sunrise 1</div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="hdr-btn" id="btn-bonus">📖</button>
      <button class="hdr-btn" id="btn-restart">↺</button>
    </div>
  </header>

  <div class="nav-tabs">
    <button class="tab active" id="tab-lvl">🌟 Levels</button>
    <button class="tab" id="tab-day">🦋 Daily Puzzle</button>
    <button class="tab" id="tab-snc">🌸 Sanctuary</button>
  </div>

  <div id="toast">Already found!</div>

  <div id="game-view">
    <div id="board"><div id="grid"></div></div>
    <div id="preview-wrap"><div id="preview">WORD</div></div>
    <div id="wheel-wrap">
      <button class="side-btn" id="btn-shuffle"><span style="font-size:1.1rem;">🔀</span>Shuffle</button>
      <div id="wheel">
        <svg id="svg-lines"></svg>
        <div id="nodes"></div>
      </div>
      <button class="side-btn" id="btn-hint"><span style="font-size:1.1rem;">💡</span>Hint</button>
    </div>
  </div>

  <div id="sanctuary-view">
    <h3 style="text-align:center; margin-bottom:4px;">🌸 Butterfly Sanctuary</h3>
    <p style="text-align:center; font-size:0.8rem; color:#94a3b8; margin-bottom:12px;">Butterflies collected from your daily puzzles</p>
    <div class="garden" id="garden"></div>
    <div class="species-list" id="species-list"></div>
  </div>

  <div class="modal" id="cal-modal">
    <div class="card">
      <h3>📅 Daily Puzzles</h3>
      <p style="font-size:0.85rem; color:#94a3b8; margin-top:4px;">Select any day to solve and capture butterflies:</p>
      <div class="cal-grid" id="cal-grid"></div>
      <button class="btn" id="btn-close-cal">Close</button>
    </div>
  </div>

  <div class="modal" id="bonus-modal">
    <div class="card">
      <h3>📖 Bonus Words</h3>
      <div id="bonus-list" style="margin:12px 0; max-height:160px; overflow-y:auto; color:#38bdf8; font-weight:700;">None yet</div>
      <button class="btn" id="btn-close-bonus">Close</button>
    </div>
  </div>

  <div class="modal" id="win-modal">
    <div class="card">
      <div style="font-size:3rem; margin-bottom:6px;">🎉</div>
      <h2 id="win-title">Puzzle Complete!</h2>
      <p id="win-sub" style="font-size:0.9rem; color:#94a3b8; margin-top:6px;">Outstanding word solving!</p>
      <button class="btn" id="btn-next">Next Puzzle</button>
    </div>
  </div>
</div>

<script>
const LEVELS = [{"id": 1, "title": "Sunrise 1", "letters": ["C", "A", "T"], "grid": {"cols": 3, "rows": 3, "words": [{"w": "CAT", "r": 0, "c": 0, "d": "H"}, {"w": "ACT", "r": 0, "c": 1, "d": "V"}]}, "bonus": ["AT"]}, {"id": 2, "title": "Sunrise 2", "letters": ["S", "U", "N"], "grid": {"cols": 3, "rows": 3, "words": [{"w": "SUN", "r": 0, "c": 0, "d": "H"}, {"w": "US", "r": 0, "c": 1, "d": "V"}]}, "bonus": []}, {"id": 3, "title": "Forest 1", "letters": ["T", "O", "P", "S"], "grid": {"cols": 4, "rows": 4, "words": [{"w": "TOPS", "r": 0, "c": 0, "d": "H"}, {"w": "STOP", "r": 0, "c": 3, "d": "V"}, {"w": "POT", "r": 2, "c": 0, "d": "H"}, {"w": "TOP", "r": 0, "c": 0, "d": "V"}]}, "bonus": ["SPOT", "POST", "SOP", "OPT"]}, {"id": 4, "title": "Forest 2", "letters": ["L", "E", "A", "F"], "grid": {"cols": 4, "rows": 4, "words": [{"w": "LEAF", "r": 0, "c": 0, "d": "H"}, {"w": "FLEA", "r": 0, "c": 3, "d": "V"}, {"w": "ALE", "r": 2, "c": 1, "d": "H"}, {"w": "ELF", "r": 1, "c": 1, "d": "V"}]}, "bonus": ["FEAL"]}, {"id": 5, "title": "Canyon 1", "letters": ["S", "T", "O", "N", "E"], "grid": {"cols": 5, "rows": 5, "words": [{"w": "STONE", "r": 0, "c": 0, "d": "H"}, {"w": "TONES", "r": 0, "c": 1, "d": "V"}, {"w": "NOTE", "r": 2, "c": 0, "d": "H"}, {"w": "NEST", "r": 4, "c": 1, "d": "H"}, {"w": "ONE", "r": 2, "c": 1, "d": "V"}]}, "bonus": ["TONE", "TOES", "NOSE", "SENT", "EONS", "SON", "SET"]}, {"id": 6, "title": "Canyon 2", "letters": ["P", "L", "A", "N", "T"], "grid": {"cols": 5, "rows": 5, "words": [{"w": "PLANT", "r": 0, "c": 0, "d": "H"}, {"w": "PLAN", "r": 0, "c": 0, "d": "V"}, {"w": "PANT", "r": 2, "c": 0, "d": "H"}, {"w": "TAP", "r": 4, "c": 2, "d": "H"}, {"w": "ANT", "r": 2, "c": 2, "d": "V"}]}, "bonus": ["PLAT", "PAN", "TAN", "PAT", "NAP", "PAL", "LAP"]}, {"id": 7, "title": "Mountain 1", "letters": ["C", "L", "O", "U", "D"], "grid": {"cols": 5, "rows": 5, "words": [{"w": "CLOUD", "r": 0, "c": 0, "d": "H"}, {"w": "COLD", "r": 0, "c": 0, "d": "V"}, {"w": "LOUD", "r": 2, "c": 1, "d": "H"}, {"w": "DUO", "r": 0, "c": 3, "d": "V"}, {"w": "OLD", "r": 1, "c": 1, "d": "V"}]}, "bonus": ["CLOD", "COD", "DOC"]}, {"id": 8, "title": "Ocean 1", "letters": ["S", "I", "L", "V", "E", "R"], "grid": {"cols": 6, "rows": 6, "words": [{"w": "SILVER", "r": 0, "c": 0, "d": "H"}, {"w": "LIVER", "r": 0, "c": 2, "d": "V"}, {"w": "RIVER", "r": 0, "c": 5, "d": "V"}, {"w": "LIVE", "r": 2, "c": 2, "d": "H"}, {"w": "RISE", "r": 4, "c": 0, "d": "H"}, {"w": "SIRE", "r": 0, "c": 0, "d": "V"}]}, "bonus": ["SLIVER", "VEIL", "VILE", "RILE", "LIES"]}];
const DAILY = [{"letters": ["B", "U", "T", "T", "E", "R"], "grid": {"cols": 6, "rows": 6, "words": [{"w": "BUTTER", "r": 0, "c": 0, "d": "H"}, {"w": "TRUE", "r": 0, "c": 2, "d": "V"}, {"w": "TUBE", "r": 2, "c": 0, "d": "H"}, {"w": "RUBE", "r": 0, "c": 5, "d": "V"}, {"w": "BRUT", "r": 0, "c": 0, "d": "V"}, {"w": "RUT", "r": 4, "c": 2, "d": "H"}]}, "bonus": ["TUB", "BET", "BUT", "RUE"], "butterflies": [{"r": 0, "c": 2, "species": "Monarch", "color": "#f97316"}, {"r": 2, "c": 3, "species": "Blue Morpho", "color": "#0284c7"}, {"r": 0, "c": 5, "species": "Emerald Swallowtail", "color": "#10b981"}]}, {"letters": ["G", "A", "R", "D", "E", "N"], "grid": {"cols": 6, "rows": 6, "words": [{"w": "GARDEN", "r": 0, "c": 0, "d": "H"}, {"w": "DANGER", "r": 0, "c": 3, "d": "V"}, {"w": "READ", "r": 3, "c": 0, "d": "H"}, {"w": "GEAR", "r": 0, "c": 0, "d": "V"}, {"w": "NEAR", "r": 2, "c": 3, "d": "H"}, {"w": "AGE", "r": 1, "c": 0, "d": "H"}]}, "bonus": ["GRADE", "DEAN", "DARE", "EARN", "RANG", "END", "RED"], "butterflies": [{"r": 0, "c": 3, "species": "Violet Copper", "color": "#a855f7"}, {"r": 3, "c": 2, "species": "Sunset Moth", "color": "#ec4899"}, {"r": 0, "c": 0, "species": "Golden Birdwing", "color": "#eab308"}]}, {"letters": ["S", "P", "R", "I", "N", "G"], "grid": {"cols": 6, "rows": 6, "words": [{"w": "SPRING", "r": 0, "c": 0, "d": "H"}, {"w": "RINGS", "r": 0, "c": 2, "d": "V"}, {"w": "GRIP", "r": 3, "c": 1, "d": "H"}, {"w": "PING", "r": 0, "c": 1, "d": "V"}, {"w": "SPIN", "r": 0, "c": 0, "d": "V"}, {"w": "RIG", "r": 2, "c": 2, "d": "H"}]}, "bonus": ["PRIG", "SIGN", "SNIP", "SING", "PIG", "PIN", "SIN"], "butterflies": [{"r": 0, "c": 2, "species": "Blue Morpho", "color": "#0ea5e9"}, {"r": 3, "c": 3, "species": "Monarch", "color": "#f97316"}]}];
const SPECIES = {
  "Monarch": "#f97316", "Blue Morpho": "#0284c7", "Emerald Swallowtail": "#10b981",
  "Violet Copper": "#a855f7", "Sunset Moth": "#ec4899", "Golden Birdwing": "#eab308"
};

class AudioFX {
  constructor() { this.ctx = null; this.on = true; }
  init() { if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  tone(f, type="sine", dur=0.2) {
    if (!this.on) return; this.init(); if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, this.ctx.currentTime);
    g.gain.setValueAtTime(0.12, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + dur);
  }
  letter(i) { this.tone([261, 293, 329, 349, 392, 440, 493, 523][i % 8]); }
  win() { [523, 659, 783].forEach((f, i) => setTimeout(() => this.tone(f, "triangle", 0.35), i * 90)); }
  flutter() { [587, 740, 880, 1174].forEach((f, i) => setTimeout(() => this.tone(f, "sine", 0.3), i * 90)); }
  error() { this.tone(130, "sawtooth", 0.25); }
}

const sfx = new AudioFX();

class Game {
  constructor() {
    this.data = JSON.parse(localStorage.getItem("wg_data") || '{"lvl":0,"bf":0,"sp":{},"days":{},"snd":true}');
    sfx.on = this.data.snd !== false;
    this.mode = "levels";
    this.today = new Date().toISOString().slice(0, 10);
    this.dailyDate = this.today;
    this.selected = [];
    this.solved = new Set();
    this.bonusFound = new Set();
    this.dragging = false;

    this.bindUI();
    this.loadPuzzle();
  }

  save() { localStorage.setItem("wg_data", JSON.stringify(this.data)); }

  bindUI() {
    const sBtn = document.getElementById("btn-sound");
    sBtn.textContent = sfx.on ? "🔊" : "🔇";
    sBtn.onclick = () => { sfx.on = !sfx.on; this.data.snd = sfx.on; sBtn.textContent = sfx.on ? "🔊" : "🔇"; this.save(); };
    document.getElementById("tab-lvl").onclick = () => this.setMode("levels");
    document.getElementById("tab-day").onclick = () => this.openDaily();
    document.getElementById("tab-snc").onclick = () => this.setMode("sanctuary");
    document.getElementById("btn-sanctuary").onclick = () => this.setMode("sanctuary");
    document.getElementById("btn-shuffle").onclick = () => this.shuffle();
    document.getElementById("btn-hint").onclick = () => this.hint();
    document.getElementById("btn-restart").onclick = () => this.loadPuzzle();
    document.getElementById("btn-bonus").onclick = () => this.openBonus();
    document.getElementById("btn-close-bonus").onclick = () => document.getElementById("bonus-modal").classList.remove("active");
    document.getElementById("btn-close-cal").onclick = () => document.getElementById("cal-modal").classList.remove("active");
    document.getElementById("btn-next").onclick = () => { document.getElementById("win-modal").classList.remove("active"); if (this.mode==="daily") this.setMode("sanctuary"); else this.loadPuzzle(); };

    this.bindWheel();
    this.updateBfBadge();
  }

  updateBfBadge() { document.getElementById("bf-count").textContent = this.data.bf || 0; }

  setMode(m) {
    this.mode = m;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.getElementById("game-view").style.display = m === "sanctuary" ? "none" : "flex";
    document.getElementById("sanctuary-view").classList.toggle("active", m === "sanctuary");
    if (m === "levels") { document.getElementById("tab-lvl").classList.add("active"); this.loadPuzzle(); }
    else if (m === "sanctuary") { document.getElementById("tab-snc").classList.add("active"); this.renderSanctuary(); }
  }

  openDaily() {
    const modal = document.getElementById("cal-modal"), grid = document.getElementById("cal-grid");
    grid.innerHTML = "";
    const now = new Date(), y = now.getFullYear(), m = now.getMonth();
    const days = new Date(y, m + 1, 0).getDate();
    for (let d = 1; d <= days; d++) {
      const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const el = document.createElement("div");
      el.className = "cal-day" + (ds === this.today ? " today" : "") + (this.data.days[ds] ? " done" : "");
      el.textContent = d;
      el.onclick = () => { this.dailyDate = ds; modal.classList.remove("active"); this.mode = "daily"; document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active")); document.getElementById("tab-day").classList.add("active"); document.getElementById("game-view").style.display="flex"; document.getElementById("sanctuary-view").classList.remove("active"); this.loadPuzzle(); };
      grid.appendChild(el);
    }
    modal.classList.add("active");
  }

  loadPuzzle() {
    this.solved.clear(); this.bonusFound.clear(); this.bfMap = {};
    if (this.mode === "levels") {
      const idx = (this.data.lvl || 0) % LEVELS.length;
      this.pz = JSON.parse(JSON.stringify(LEVELS[idx]));
      document.getElementById("hdr-title").textContent = `Level ${this.data.lvl + 1}`;
      document.getElementById("hdr-sub").textContent = this.pz.title;
    } else {
      let h = 0; for (let i = 0; i < this.dailyDate.length; i++) h = (h << 5) - h + this.dailyDate.charCodeAt(i);
      const idx = Math.abs(h) % DAILY.length;
      this.pz = JSON.parse(JSON.stringify(DAILY[idx]));
      document.getElementById("hdr-title").textContent = "Daily Puzzle";
      document.getElementById("hdr-sub").textContent = this.dailyDate;
      if (this.pz.butterflies) this.pz.butterflies.forEach(b => this.bfMap[`${b.r},${b.c}`] = { ...b, got: false });
    }
    this.renderBoard();
    this.renderWheel();
  }

  renderBoard() {
    const g = document.getElementById("grid"), p = this.pz.grid;
    g.innerHTML = "";
    g.style.gridTemplateColumns = `repeat(${p.cols}, 44px)`;
    g.style.gridTemplateRows = `repeat(${p.rows}, 44px)`;
    this.cells = {};
    p.words.forEach(w => {
      for (let i = 0; i < w.w.length; i++) {
        const r = w.d === "H" ? w.r : w.r + i, c = w.d === "H" ? w.c + i : w.c;
        this.cells[`${r},${c}`] = w.w[i];
      }
    });
    for (let r = 0; r < p.rows; r++) {
      for (let c = 0; c < p.cols; c++) {
        const k = `${r},${c}`, el = document.createElement("div");
        el.id = `c-${k}`;
        if (this.cells[k]) {
          el.className = "cell empty";
          if (this.bfMap[k]) {
            const bf = document.createElement("div");
            bf.className = "bf-icon"; bf.id = `bf-${k}`;
            bf.innerHTML = `<svg viewBox="0 0 32 32"><path d="M16 12 C10 4 2 8 4 18 C6 24 14 22 16 18 C18 22 26 24 28 18 C30 8 22 4 16 12 Z" fill="${this.bfMap[k].color}"/><circle cx="16" cy="15" r="2" fill="#fff"/></svg>`;
            el.appendChild(bf);
          }
        } else el.className = "cell inactive";
        g.appendChild(el);
      }
    }
  }

  renderWheel() {
    const nodes = document.getElementById("nodes"), l = this.pz.letters;
    nodes.innerHTML = "";
    const cx = 105, cy = 105, rad = 70;
    l.forEach((char, i) => {
      const ang = (i * 2 * Math.PI / l.length) - Math.PI / 2;
      const x = cx + rad * Math.cos(ang), y = cy + rad * Math.sin(ang);
      const el = document.createElement("div");
      el.className = "node"; el.id = `n-${i}`; el.textContent = char;
      el.style.left = `${x}px`; el.style.top = `${y}px`;
      el.dataset.i = i; el.dataset.ch = char; el.dataset.x = x; el.dataset.y = y;
      nodes.appendChild(el);
    });
    document.getElementById("svg-lines").innerHTML = "";
  }

  shuffle() {
    this.pz.letters.sort(() => Math.random() - 0.5);
    this.renderWheel();
    this.toast("Letters shuffled");
  }

  hint() {
    const unrevealed = Object.keys(this.cells).filter(k => !document.getElementById(`c-${k}`).classList.contains("solved"));
    if (!unrevealed.length) return this.toast("All solved!");
    const pick = unrevealed[Math.floor(Math.random() * unrevealed.length)];
    const el = document.getElementById(`c-${pick}`);
    el.className = "cell solved"; el.textContent = this.cells[pick];
    sfx.letter(0);
    this.checkWin();
  }

  openBonus() {
    const l = document.getElementById("bonus-list");
    l.innerHTML = this.bonusFound.size ? Array.from(this.bonusFound).map(w=>`★ ${w}`).join("<br>") : "None yet";
    document.getElementById("bonus-modal").classList.add("active");
  }

  bindWheel() {
    const w = document.getElementById("wheel");
    const onStart = (x, y) => { this.dragging = true; this.selected = []; sfx.init(); this.onMove(x, y); };
    const onEnd = () => { if (!this.dragging) return; this.dragging = false; this.submit(); };

    w.addEventListener("touchstart", e => { e.preventDefault(); onStart(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    window.addEventListener("touchmove", e => { if (this.dragging) this.onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    window.addEventListener("touchend", onEnd);
    window.addEventListener("touchcancel", onEnd);

    w.addEventListener("mousedown", e => onStart(e.clientX, e.clientY));
    window.addEventListener("mousemove", e => { if (this.dragging) this.onMove(e.clientX, e.clientY); });
    window.addEventListener("mouseup", onEnd);
  }

  onMove(clientX, clientY) {
    const rect = document.getElementById("wheel").getBoundingClientRect();
    const rx = clientX - rect.left, ry = clientY - rect.top;
    document.querySelectorAll(".node").forEach(n => {
      const x = +n.dataset.x, y = +n.dataset.y, idx = n.dataset.i;
      if (Math.hypot(rx - x, ry - y) < 28) {
        const has = this.selected.find(s => s.i === idx);
        if (!has) {
          n.classList.add("selected");
          this.selected.push({ i: idx, ch: n.dataset.ch, x, y, el: n });
          sfx.letter(this.selected.length - 1);
        } else if (this.selected.length > 1 && this.selected[this.selected.length - 2].i === idx) {
          const popped = this.selected.pop();
          popped.el.classList.remove("selected");
        }
      }
    });
    this.drawLines(rx, ry);
    const prev = document.getElementById("preview");
    if (this.selected.length) { prev.textContent = this.selected.map(s => s.ch).join(""); prev.classList.add("show"); }
    else prev.classList.remove("show");
  }

  drawLines(rx, ry) {
    const svg = document.getElementById("svg-lines");
    if (!this.selected.length) return svg.innerHTML = "";
    let pts = this.selected.map(s => `${s.x},${s.y}`).join(" ");
    svg.innerHTML = `<polyline points="${pts}" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="${this.selected[this.selected.length-1].x}" y1="${this.selected[this.selected.length-1].y}" x2="${rx}" y2="${ry}" stroke="rgba(56,189,248,0.5)" stroke-width="5" stroke-linecap="round"/>`;
  }

  submit() {
    const word = this.selected.map(s => s.ch).join("");
    document.querySelectorAll(".node").forEach(n => n.classList.remove("selected"));
    document.getElementById("svg-lines").innerHTML = "";
    document.getElementById("preview").classList.remove("show");
    if (word.length < 2) return;

    const target = this.pz.grid.words.find(w => w.w === word);
    if (target) {
      if (this.solved.has(word)) { this.toast("Already found!"); sfx.error(); }
      else {
        this.solved.add(word);
        this.reveal(target);
        sfx.win();
        this.checkWin();
      }
      return;
    }

    if (this.pz.bonus && this.pz.bonus.includes(word)) {
      if (this.bonusFound.has(word)) this.toast("Bonus already found!");
      else { this.bonusFound.add(word); this.toast(`Bonus: ${word}! ✨`); sfx.win(); }
      return;
    }

    sfx.error();
    const p = document.getElementById("preview");
    p.textContent = word; p.classList.add("show", "shake");
    setTimeout(() => p.classList.remove("show", "shake"), 450);
  }

  reveal(w) {
    for (let i = 0; i < w.w.length; i++) {
      const r = w.d === "H" ? w.r : w.r + i, c = w.d === "H" ? w.c + i : w.c, k = `${r},${c}`;
      const el = document.getElementById(`c-${k}`);
      if (el) {
        el.className = "cell solved"; el.textContent = w.w[i];
        if (this.bfMap[k] && !this.bfMap[k].got) this.collectBf(k, el);
      }
    }
  }

  collectBf(k, cell) {
    const bf = this.bfMap[k]; bf.got = true;
    const icon = document.getElementById(`bf-${k}`);
    if (icon) {
      const r1 = cell.getBoundingClientRect(), r2 = document.getElementById("btn-sanctuary").getBoundingClientRect();
      const fly = document.createElement("div");
      fly.className = "flying-bf"; fly.style.left = `${r1.left+8}px`; fly.style.top = `${r1.top+8}px`;
      fly.innerHTML = icon.innerHTML;
      document.body.appendChild(fly);
      icon.remove(); sfx.flutter();
      requestAnimationFrame(() => { fly.style.left = `${r2.left+10}px`; fly.style.top = `${r2.top+6}px`; fly.style.transform = "scale(1.3) rotate(20deg)"; });
      setTimeout(() => {
        fly.remove();
        this.data.bf = (this.data.bf || 0) + 1;
        this.data.sp[bf.species] = (this.data.sp[bf.species] || 0) + 1;
        this.save();
        this.updateBfBadge();
        this.toast(`Captured ${bf.species}! 🦋`);
      }, 850);
    }
  }

  checkWin() {
    if (this.solved.size >= this.pz.grid.words.length) {
      setTimeout(() => {
        const m = document.getElementById("win-modal");
        if (this.mode === "levels") {
          this.data.lvl = (this.data.lvl || 0) + 1; this.save();
          document.getElementById("win-title").textContent = "Level Complete!";
          document.getElementById("win-sub").textContent = `Solved all words for Level ${this.data.lvl}!`;
          document.getElementById("btn-next").textContent = "Next Level";
        } else {
          this.data.days[this.dailyDate] = true; this.save();
          document.getElementById("win-title").textContent = "Daily Complete!";
          document.getElementById("win-sub").textContent = `Butterflies added to your sanctuary!`;
          document.getElementById("btn-next").textContent = "View Sanctuary";
        }
        m.classList.add("active");
      }, 500);
    }
  }

  toast(m) {
    const t = document.getElementById("toast");
    t.textContent = m; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1500);
  }

  renderSanctuary() {
    const g = document.getElementById("garden"), sl = document.getElementById("species-list");
    g.innerHTML = ""; sl.innerHTML = "";
    const total = this.data.bf || 0;
    for (let i = 0; i < Math.min(total, 12); i++) {
      const b = document.createElement("div");
      b.className = "g-bf";
      b.style.left = `${15 + Math.random() * 70}%`; b.style.top = `${20 + Math.random() * 55}%`;
      b.style.animationDelay = `${Math.random() * 3}s`;
      const sp = Object.keys(SPECIES)[i % Object.keys(SPECIES).length];
      b.innerHTML = `<svg viewBox="0 0 32 32"><path d="M16 12 C10 4 2 8 4 18 C6 24 14 22 16 18 C18 22 26 24 28 18 C30 8 22 4 16 12 Z" fill="${SPECIES[sp]}"/><circle cx="16" cy="15" r="2" fill="#fff"/></svg>`;
      g.appendChild(b);
    }
    if (!total) g.innerHTML = '<div style="text-align:center; padding-top:70px; color:#cbd5e1; font-size:0.85rem;">Solve daily puzzles to attract butterflies!</div>';
    Object.keys(SPECIES).forEach(k => {
      const count = (this.data.sp && this.data.sp[k]) || 0;
      const el = document.createElement("div");
      el.className = "sp-card";
      el.innerHTML = `<div style="width:28px; height:28px;"><svg viewBox="0 0 32 32"><path d="M16 12 C10 4 2 8 4 18 C6 24 14 22 16 18 C18 22 26 24 28 18 C30 8 22 4 16 12 Z" fill="${count?SPECIES[k]:'#64748b'}"/></svg></div><div><div style="font-size:0.85rem; font-weight:700;">${k}</div><div style="font-size:0.75rem; color:${count?'#38bdf8':'#94a3b8'};">${count?`${count} Captured`:'Undiscovered'}</div></div>`;
      sl.appendChild(el);
    });
  }
}

window.addEventListener("DOMContentLoaded", () => new Game());
</script>
</body>
</html>
